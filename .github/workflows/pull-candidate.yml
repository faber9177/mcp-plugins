name: Pull Faber plugin candidate

on:
  pull_request:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pull-faber-plugin-candidate
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release automation
        run: |
          python3 -m unittest scripts/pull_candidate_test.py
          scripts/publish_candidate_pr_test.sh
          scripts/validate-public-release.test.sh
          scripts/validate-public-release.sh .

  pull:
    if: github.event_name != 'pull_request' && github.repository == 'faber9177/mcp-plugins' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/pull_candidate.py --check-open-release

      - name: Create and merge trusted release
        if: steps.candidate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish_candidate_pr.sh "${{ steps.candidate.outputs.version }}" "${{ steps.candidate.outputs.candidate_id }}"
